<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | CompanyFlow</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f7fb;
      color: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo a {
      text-decoration: none;
      font-size: 28px;
      font-weight: 800;
      color: #172033;
    }

    .logo span {
      color: #2563eb;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 35px rgba(15, 23, 42, 0.06);
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,.10);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 70px;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #2563eb;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .terms {
      display: flex;
      gap: 9px;
      margin: 18px 0;
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
    }

    .terms input {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .terms label {
      font-weight: normal;
    }

    .create-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .create-btn:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #b91c1c;
    }

    .signin {
      text-align: center;
      margin-top: 22px;
      color: #64748b;
      font-size: 13px;
    }

    .signin a,
    .back-home {
      color: #2563eb;
      text-decoration: none;
      font-weight: 700;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }

    .security-note {
      margin-top: 20px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
      color: #64748b;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 500px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 24px 20px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <a href="index.html">
      Company<span>Flow</span>
    </a>
  </div>

  <div class="card">

    <h1>Create Your Account</h1>

    <p class="subtitle">
      Start managing your business with CompanyFlow.
    </p>

    <form id="registerForm">

      <div class="form-group">
        <label for="companyName">Company Name</label>
        <input
          type="text"
          id="companyName"
          placeholder="Enter your company name"
          required
        >
      </div>

      <div class="form-group">
        <label for="ownerName">Owner / Manager Name</label>
        <input
          type="text"
          id="ownerName"
          placeholder="Enter your full name"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Business Email</label>
        <input
          type="email"
          id="email"
          placeholder="you@company.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            placeholder="Create a password"
            minlength="6"
            required
          >

          <button
            type="button"
            class="show-password"
            onclick="togglePassword()"
          >
            Show
          </button>
        </div>
      </div>

      <div class="terms">
        <input
          type="checkbox"
          id="terms"
          required
        >

        <label for="terms">
          I agree to the CompanyFlow terms and understand that
          my account will be securely managed by CompanyFlow.
        </label>
      </div>

      <button
        type="submit"
        class="create-btn"
        id="createBtn"
      >
        Create Account
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </form>

    <div class="signin">
      Already have an account?
      <a href="signin.html">Sign In</a>
    </div>

    <a href="index.html" class="back-home">
      ← Back to Homepage
    </a>

    <div class="security-note">
      Your password is securely handled by CompanyFlow authentication.
      It is not stored in browser local storage.
    </div>

  </div>

</div>


<!-- Supabase MUST load first -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- CompanyFlow Supabase connection -->
<script src="supabase.js"></script>


<script>

function togglePassword() {

  const password =
    document.getElementById("password");

  const button =
    document.querySelector(".show-password");

  if (password.type === "password") {

    password.type = "text";
    button.textContent = "Hide";

  } else {

    password.type = "password";
    button.textContent = "Show";

  }

}


function showMessage(text, type) {

  const message =
    document.getElementById("message");

  message.className =
    "message " + type;

  message.textContent =
    text;

  message.style.display =
    "block";

}


document
  .getElementById("registerForm")
  .addEventListener("submit", async function(event) {

    event.preventDefault();

    const companyName =
      document.getElementById("companyName").value.trim();

    const ownerName =
      document.getElementById("ownerName").value.trim();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const createBtn =
      document.getElementById("createBtn");


    if (!companyName || !ownerName || !email || !password) {

      showMessage(
        "Please complete all required fields.",
        "error"
      );

      return;
    }


    if (password.length < 6) {

      showMessage(
        "Password must be at least 6 characters.",
        "error"
      );

      return;
    }


    createBtn.disabled = true;
    createBtn.textContent = "Creating Account...";


    try {

      const { data, error } =
        await supabaseClient.auth.signUp({

          email: email,

          password: password,

          options: {
            data: {
              full_name: ownerName,
              company_name: companyName
            }
          }

        });


      if (error) {
        throw error;
      }


      localStorage.setItem(
        "companyName",
        companyName
      );

      localStorage.setItem(
        "ownerName",
        ownerName
      );

      localStorage.setItem(
        "userEmail",
        email
      );


      showMessage(
        "Account created successfully. Please check your email if confirmation is required.",
        "success"
      );


      setTimeout(function() {

        window.location.href =
          "signin.html";

      }, 1800);


    } catch (error) {

      console.error(
        "Registration error:",
        error
      );


      let errorMessage =
        "Unable to create your account. Please try again.";


      if (error.message) {
        errorMessage = error.message;
      }


      if (
        error.message &&
        error.message
          .toLowerCase()
          .includes("already registered")
      ) {

        errorMessage =
          "This email is already registered. Please sign in.";

      }


      showMessage(
        errorMessage,
        "error"
      );


      createBtn.disabled = false;
      createBtn.textContent = "Create Account";

    }

  });

</script>

</body>
</html>
