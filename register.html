<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ثبت‌نام | CompanyFlow</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 450px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 17px;
      border: 1px solid #dbe3f0;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #64748b;
    }

    .login a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">CompanyFlow</div>

    <h1>ساخت حساب شرکت</h1>

    <p class="subtitle">
      برای شروع مدیریت شرکت خود ثبت‌نام کنید.
    </p>

    <form id="registerForm">

      <label>نام شرکت</label>
      <input
        type="text"
        id="companyName"
        placeholder="مثلاً ABC Company"
        required
      >

      <label>نام مدیر</label>
      <input
        type="text"
        id="ownerName"
        placeholder="نام شما"
        required
      >

      <label>ایمیل</label>
      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        required
      >

      <label>رمز عبور</label>
      <input
        type="password"
        id="password"
        placeholder="حداقل 8 کاراکتر"
        minlength="8"
        required
      >

      <button type="submit">
        ایجاد حساب
      </button>

    </form>

    <div class="login">
      قبلاً حساب دارید؟
      <a href="login.html">وارد شوید</a>
    </div>

  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", function(event) {

      event.preventDefault();

      const companyName =
        document.getElementById("companyName").value;

      const ownerName =
        document.getElementById("ownerName").value;

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      if (password.length < 8) {
        alert("رمز عبور باید حداقل 8 کاراکتر باشد.");
        return;
      }

      alert(
        "حساب شرکت " +
        companyName +
        " با موفقیت ایجاد شد."
      );

    });
  </script>

</body>
</html>
