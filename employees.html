<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employees | CompanyFlow</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #f8fafc;
    color: #0f172a;
}

header {
    background: #0f172a;
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #60a5fa;
    font-size: 24px;
    font-weight: 800;
}

.back {
    color: #cbd5e1;
    text-decoration: none;
    font-size: 14px;
}

.container {
    max-width: 1200px;
    margin: 35px auto;
    padding: 0 20px;
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
}

h1 {
    font-size: 30px;
    margin-bottom: 7px;
}

.subtitle {
    color: #64748b;
}

.add-button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.add-button:hover {
    opacity: .9;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 25px;
}

.stat {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 22px;
}

.stat-title {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 10px;
}

.stat-value {
    font-size: 28px;
    font-weight: 800;
}

/* SEARCH */

.toolbar {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
}

.search {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
}

.search:focus {
    border-color: #2563eb;
}

/* TABLE */

.table-card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    overflow: hidden;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #f8fafc;
    color: #64748b;
    font-size: 12px;
    text-align: left;
    padding: 15px;
    border-bottom: 1px solid #e2e8f0;
}

td {
    padding: 16px 15px;
    border-bottom: 1px solid #e2e8f0;
    font-size: 14px;
}

tr:last-child td {
    border-bottom: none;
}

.employee-name {
    font-weight: 700;
}

.employee-email {
    color: #64748b;
    font-size: 12px;
    margin-top: 4px;
}

.badge {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.active {
    background: #dcfce7;
    color: #166534;
}

.inactive {
    background: #fee2e2;
    color: #991b1b;
}

.action-button {
    background: #eff6ff;
    color: #2563eb;
    border: none;
    padding: 7px 11px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
}

.empty {
    text-align: center;
    padding: 45px 20px;
    color: #64748b;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .55);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 520px;
    border-radius: 16px;
    padding: 25px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.close {
    background: #f1f5f9;
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.field {
    display: flex;
    flex-direction: column;
}

.field.full {
    grid-column: 1 / -1;
}

label {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 7px;
}

input,
select {
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
}

input:focus,
select:focus {
    border-color: #2563eb;
}

.save-button {
    width: 100%;
    margin-top: 20px;
    background: #2563eb;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

footer {
    text-align: center;
    color: #64748b;
    padding: 30px;
}

/* MOBILE */

@media (max-width: 800px) {

    .page-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .add-button {
        width: 100%;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .table-card {
        overflow-x: auto;
    }

    table {
        min-width: 750px;
    }
}

@media (max-width: 550px) {

    .form-grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        CompanyFlow
    </div>

    <a href="dashboard.html" class="back">
        ← Back to Dashboard
    </a>

</header>


<div class="container">

    <div class="page-header">

        <div>

            <h1>Employees</h1>

            <p class="subtitle">
                Manage your team members and employee information.
            </p>

        </div>

        <button
            class="add-button"
            onclick="openModal()">

            + Add Employee

        </button>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">

            <div class="stat-title">
                Total Employees
            </div>

            <div
                class="stat-value"
                id="totalEmployees">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Active Employees
            </div>

            <div
                class="stat-value"
                id="activeEmployees">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Inactive Employees
            </div>

            <div
                class="stat-value"
                id="inactiveEmployees">
                0
            </div>

        </div>

    </div>


    <!-- SEARCH -->

    <div class="toolbar">

        <input
            type="text"
            class="search"
            id="search"
            placeholder="Search employees by name, email, role, or department..."
            oninput="renderEmployees()"
        >

    </div>


    <!-- EMPLOYEES -->

    <div class="table-card">

        <table>

            <thead>

                <tr>

                    <th>Employee</th>

                    <th>Role</th>

                    <th>Department</th>

                    <th>Phone</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="employeeList"></tbody>

        </table>

    </div>

</div>


<!-- ADD EMPLOYEE MODAL -->

<div
    class="modal"
    id="employeeModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>Add Employee</h2>

            <button
                class="close"
                onclick="closeModal()">
                ×
            </button>

        </div>


        <div class="form-grid">

            <div class="field">

                <label>Full Name</label>

                <input
                    type="text"
                    id="employeeName"
                    placeholder="John Smith"
                >

            </div>


            <div class="field">

                <label>Email</label>

                <input
                    type="email"
                    id="employeeEmail"
                    placeholder="john@company.com"
                >

            </div>


            <div class="field">

                <label>Role</label>

                <input
                    type="text"
                    id="employeeRole"
                    placeholder="Sales Manager"
                >

            </div>


            <div class="field">

                <label>Department</label>

                <select id="employeeDepartment">

                    <option value="Management">
                        Management
                    </option>

                    <option value="Sales">
                        Sales
                    </option>

                    <option value="Marketing">
                        Marketing
                    </option>

                    <option value="Finance">
                        Finance
                    </option>

                    <option value="Operations">
                        Operations
                    </option>

                    <option value="Human Resources">
                        Human Resources
                    </option>

                    <option value="IT">
                        IT
                    </option>

                </select>

            </div>


            <div class="field">

                <label>Phone</label>

                <input
                    type="tel"
                    id="employeePhone"
                    placeholder="+1 555 000 0000"
                >

            </div>


            <div class="field">

                <label>Status</label>

                <select id="employeeStatus">

                    <option value="Active">
                        Active
                    </option>

                    <option value="Inactive">
                        Inactive
                    </option>

                </select>

            </div>

        </div>


        <button
            class="save-button"
            onclick="addEmployee()">

            Add Employee

        </button>

    </div>

</div>


<footer>
    © 2026 CompanyFlow. All rights reserved.
</footer>


<script>

function getEmployees() {

    const saved =
        localStorage.getItem("employees");

    if (!saved) {

        return [];

    }

    return JSON.parse(saved);

}


function saveEmployees(employees) {

    localStorage.setItem(
        "employees",
        JSON.stringify(employees)
    );

}


function renderEmployees() {

    const employees =
        getEmployees();

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const filtered =
        employees.filter(function(employee) {

            return (
                employee.name.toLowerCase().includes(search) ||
                employee.email.toLowerCase().includes(search) ||
                employee.role.toLowerCase().includes(search) ||
                employee.department.toLowerCase().includes(search)
            );

        });


    const list =
        document.getElementById("employeeList");


    if (filtered.length === 0) {

        list.innerHTML = `
            <tr>
                <td colspan="6">
                    <div class="empty">
                        No employees found.
                    </div>
                </td>
            </tr>
        `;

    } else {

        list.innerHTML =
            filtered.map(function(employee) {

                return `

                    <tr>

                        <td>

                            <div class="employee-name">
                                ${employee.name}
                            </div>

                            <div class="employee-email">
                                ${employee.email}
                            </div>

                        </td>


                        <td>
                            ${employee.role}
                        </td>


                        <td>
                            ${employee.department}
                        </td>


                        <td>
                            ${employee.phone || "-"}
                        </td>


                        <td>

                            <span class="badge ${
                                employee.status === "Active"
                                ? "active"
                                : "inactive"
                            }">

                                ${employee.status}

                            </span>

                        </td>


                        <td>

                            <button
                                class="action-button"
                                onclick="deleteEmployee(${employee.id})">

                                Delete

                            </button>

                        </td>

                    </tr>

                `;

            }).join("");

    }


    updateStats(employees);

}


function updateStats(employees) {

    const total =
        employees.length;

    const active =
        employees.filter(
            employee => employee.status === "Active"
        ).length;

    const inactive =
        employees.filter(
            employee => employee.status === "Inactive"
        ).length;


    document.getElementById(
        "totalEmployees"
    ).textContent = total;


    document.getElementById(
        "activeEmployees"
    ).textContent = active;


    document.getElementById(
        "inactiveEmployees"
    ).textContent = inactive;

}


function openModal() {

    document.getElementById(
        "employeeModal"
    ).style.display = "flex";

}


function closeModal() {

    document.getElementById(
        "employeeModal"
    ).style.display = "none";

}


function addEmployee() {

    const name =
        document.getElementById(
            "employeeName"
        ).value.trim();

    const email =
        document.getElementById(
            "employeeEmail"
        ).value.trim();

    const role =
        document.getElementById(
            "employeeRole"
        ).value.trim();

    const department =
        document.getElementById(
            "employeeDepartment"
        ).value;

    const phone =
        document.getElementById(
            "employeePhone"
        ).value.trim();

    const status =
        document.getElementById(
            "employeeStatus"
        ).value;


    if (!name || !email || !role) {

        alert(
            "Please enter the employee name, email, and role."
        );

        return;

    }


    const employees =
        getEmployees();


    employees.push({

        id: Date.now(),

        name: name,

        email: email,

        role: role,

        department: department,

        phone: phone,

        status: status

    });


    saveEmployees(employees);


    document.getElementById(
        "employeeName"
    ).value = "";

    document.getElementById(
        "employeeEmail"
    ).value = "";

    document.getElementById(
        "employeeRole"
    ).value = "";

    document.getElementById(
        "employeePhone"
    ).value = "";


    closeModal();

    renderEmployees();

}


function deleteEmployee(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this employee?"
        );

    if (!confirmed) return;


    const employees =
        getEmployees()
        .filter(employee => employee.id !== id);


    saveEmployees(employees);

    renderEmployees();

}


renderEmployees();

</script>

</body>
</html>
