<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calendar & Meetings - CompanyFlow</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f5f7fb;
color:#1f2937;
}

.sidebar{
position:fixed;
left:0;
top:0;
bottom:0;
width:240px;
background:#111827;
color:white;
padding:25px 15px;
}

.logo{
font-size:24px;
font-weight:bold;
margin-bottom:30px;
text-align:center;
}

.sidebar a{
display:block;
color:#d1d5db;
text-decoration:none;
padding:12px 14px;
border-radius:8px;
margin-bottom:5px;
}

.sidebar a:hover,
.sidebar a.active{
background:#2563eb;
color:white;
}

.main{
margin-left:240px;
padding:30px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.header h1{
margin:0;
font-size:30px;
}

.add-btn{
background:#2563eb;
color:white;
border:0;
padding:12px 18px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.add-btn:hover{
background:#1d4ed8;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
margin-bottom:25px;
}

.stat{
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.stat h3{
margin:0 0 8px;
font-size:14px;
color:#6b7280;
}

.stat p{
margin:0;
font-size:28px;
font-weight:bold;
}

.toolbar{
background:white;
padding:18px;
border-radius:12px;
margin-bottom:20px;
}

.search{
width:100%;
padding:12px;
border:1px solid #d1d5db;
border-radius:8px;
font-size:15px;
}

.message{
display:none;
padding:12px 15px;
border-radius:8px;
margin-bottom:20px;
font-weight:600;
}

.success{
background:#dcfce7;
color:#166534;
}

.error{
background:#fee2e2;
color:#991b1b;
}

.meetings{
display:grid;
gap:15px;
}

.meeting{
background:white;
border-radius:12px;
padding:20px;
box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.meeting-top{
display:flex;
justify-content:space-between;
gap:15px;
}

.meeting h2{
margin:0 0 10px;
font-size:19px;
}

.info{
color:#6b7280;
font-size:14px;
line-height:1.8;
}

.status{
display:inline-block;
padding:5px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold;
background:#dbeafe;
color:#1d4ed8;
}

.actions{
margin-top:15px;
display:flex;
gap:8px;
}

.actions button{
border:0;
padding:8px 12px;
border-radius:7px;
cursor:pointer;
font-weight:600;
}

.complete-btn{
background:#dcfce7;
color:#166534;
}

.cancel-btn{
background:#fef3c7;
color:#92400e;
}

.delete-btn{
background:#fee2e2;
color:#991b1b;
}

.empty{
background:white;
padding:40px;
text-align:center;
border-radius:12px;
color:#6b7280;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
align-items:center;
justify-content:center;
padding:20px;
}

.modal-box{
background:white;
width:100%;
max-width:600px;
max-height:90vh;
overflow:auto;
border-radius:14px;
padding:25px;
}

.modal-box h2{
margin-top:0;
}

.form-group{
margin-bottom:15px;
}

.form-group label{
display:block;
font-weight:600;
margin-bottom:6px;
}

.form-group input,
.form-group textarea,
.form-group select{
width:100%;
padding:11px;
border:1px solid #d1d5db;
border-radius:8px;
font-size:14px;
}

.form-group textarea{
min-height:90px;
resize:vertical;
}

.form-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

.modal-actions{
display:flex;
gap:10px;
margin-top:20px;
}

.save-btn{
flex:1;
background:#2563eb;
color:white;
border:0;
padding:12px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.close-btn{
flex:1;
background:#e5e7eb;
color:#374151;
border:0;
padding:12px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

@media(max-width:800px){

.sidebar{
position:relative;
width:100%;
height:auto;
}

.main{
margin-left:0;
padding:20px;
}

.stats{
grid-template-columns:1fr;
}

.form-row{
grid-template-columns:1fr;
}

.header{
flex-direction:column;
align-items:flex-start;
gap:15px;
}

}

</style>

</head>

<body>

<div class="sidebar">

<div class="logo">
CompanyFlow
</div>

<a href="dashboard.html">Dashboard</a>
<a href="employees.html">Employees</a>
<a href="customers.html">Customers</a>
<a href="projects.html">Projects</a>
<a href="tasks.html">Tasks</a>
<a href="calendar.html" class="active">Calendar</a>
<a href="finance.html">Finance</a>
<a href="inventory.html">Inventory</a>
<a href="documents.html">Documents</a>
<a href="reports.html">Reports</a>
<a href="roles.html">Roles & Permissions</a>
<a href="notifications.html">Notifications</a>
<a href="settings.html">Settings</a>
<a href="index.html">Back to Website</a>

</div>


<div class="main">

<div class="header">

<div>
<h1>Calendar & Meetings</h1>
<p style="color:#6b7280;">
Manage your company meetings in one place.
</p>
</div>

<button class="add-btn" onclick="openModal()">
+ Add Meeting
</button>

</div>


<div id="message" class="message"></div>


<div class="stats">

<div class="stat">
<h3>Total Meetings</h3>
<p id="totalMeetings">0</p>
</div>

<div class="stat">
<h3>Scheduled</h3>
<p id="scheduledMeetings">0</p>
</div>

<div class="stat">
<h3>Completed</h3>
<p id="completedMeetings">0</p>
</div>

</div>


<div class="toolbar">

<input
id="searchInput"
class="search"
type="text"
placeholder="Search meetings..."
oninput="renderMeetings()">

</div>


<div id="meetingsList" class="meetings"></div>

</div>


<!-- MODAL -->

<div id="meetingModal" class="modal">

<div class="modal-box">

<h2>Add Meeting</h2>


<div class="form-group">

<label>Meeting Title</label>

<input
id="title"
type="text"
placeholder="e.g. Weekly Team Meeting">

</div>


<div class="form-row">

<div class="form-group">

<label>Date</label>

<input
id="meetingDate"
type="date">

</div>


<div class="form-group">

<label>Time</label>

<input
id="meetingTime"
type="time">

</div>

</div>


<div class="form-group">

<label>Location</label>

<input
id="location"
type="text"
placeholder="Office / Conference Room">

</div>


<div class="form-group">

<label>Meeting Link</label>

<input
id="meetingLink"
type="url"
placeholder="https://...">

</div>


<div class="form-group">

<label>Participants</label>

<input
id="participants"
type="text"
placeholder="John, Sarah, Michael">

</div>


<div class="form-group">

<label>Status</label>

<select id="status">

<option value="Scheduled">
Scheduled
</option>

<option value="Completed">
Completed
</option>

<option value="Cancelled">
Cancelled
</option>

</select>

</div>


<div class="form-group">

<label>Description</label>

<textarea
id="description"
placeholder="Meeting details..."></textarea>

</div>


<div class="modal-actions">

<button
class="close-btn"
onclick="closeModal()">
Cancel
</button>

<button
class="save-btn"
onclick="addMeeting()">
Save Meeting
</button>

</div>

</div>

</div>


<script>

let companyId = null;
let meetings = [];


/* =========================
   MESSAGE
========================= */

function showMessage(message,isError){

const box =
document.getElementById("message");

box.textContent = message;

box.className =
"message " + (isError ? "error" : "success");

box.style.display = "block";

setTimeout(() => {
box.style.display = "none";
},4000);

}


/* =========================
   LOAD USER
========================= */

async function loadUser(){

const {
data:{
user
},
error
} =
await supabaseClient.auth.getUser();


if(error || !user){

window.location.href="signin.html";

return;

}


const {
data:profile,
error:profileError
} =
await supabaseClient
.from("profiles")
.select("company_id")
.eq("id",user.id)
.single();


if(profileError || !profile){

showMessage(
"Could not load company information.",
true
);

return;

}


companyId = profile.company_id;

await loadMeetings();

}


/* =========================
   LOAD MEETINGS
========================= */

async function loadMeetings(){

const {
data,
error
} =
await supabaseClient
.from("meetings")
.select("*")
.eq("company_id",companyId)
.order("meeting_date",{ascending:true})
.order("meeting_time",{ascending:true});


if(error){

showMessage(
"Could not load meetings: " + error.message,
true
);

return;

}


meetings = data || [];

renderMeetings();

updateStats();

}


/* =========================
   RENDER
========================= */

function renderMeetings(){

const list =
document.getElementById("meetingsList");

const search =
document.getElementById("searchInput")
.value
.toLowerCase()
.trim();


const filtered =
meetings.filter(meeting => {

return (

(meeting.title || "")
.toLowerCase()
.includes(search)

||

(meeting.location || "")
.toLowerCase()
.includes(search)

||

(meeting.participants || "")
.toLowerCase()
.includes(search)

);

});


if(filtered.length === 0){

list.innerHTML = `
<div class="empty">
No meetings found.
</div>
`;

return;

}


list.innerHTML =
filtered.map(meeting => {

const date =
meeting.meeting_date
? new Date(
meeting.meeting_date + "T00:00:00"
).toLocaleDateString()
: "No date";


const time =
meeting.meeting_time
? meeting.meeting_time.substring(0,5)
: "No time";


return `

<div class="meeting">

<div class="meeting-top">

<div>

<h2>
${escapeHTML(meeting.title)}
</h2>

<div class="info">

📅 ${date}<br>

⏰ ${time}<br>

📍 ${escapeHTML(meeting.location || "No location")}<br>

👥 ${escapeHTML(meeting.participants || "No participants")}

${meeting.meeting_link ? `
<br>
🔗
<a
href="${escapeHTML(meeting.meeting_link)}"
target="_blank">
Open Meeting Link
</a>
` : ""}

</div>

</div>

<div>

<span class="status">
${escapeHTML(meeting.status || "Scheduled")}
</span>

</div>

</div>


${meeting.description ? `

<p class="info">

${escapeHTML(meeting.description)}

</p>

` : ""}


<div class="actions">

${
meeting.status !== "Completed"
?
`<button
class="complete-btn"
onclick="changeStatus('${meeting.id}','Completed')">
Complete
</button>`
:
""
}

${
meeting.status !== "Cancelled"
?
`<button
class="cancel-btn"
onclick="changeStatus('${meeting.id}','Cancelled')">
Cancel
</button>`
:
""
}

<button
class="delete-btn"
onclick="deleteMeeting('${meeting.id}')">
Delete
</button>

</div>

</div>

`;

}).join("");

}


/* =========================
   STATS
========================= */

function updateStats(){

document.getElementById("totalMeetings")
.textContent = meetings.length;

document.getElementById("scheduledMeetings")
.textContent =
meetings.filter(
m => m.status === "Scheduled"
).length;

document.getElementById("completedMeetings")
.textContent =
meetings.filter(
m => m.status === "Completed"
).length;

}


/* =========================
   ADD MEETING
========================= */

async function addMeeting(){

const title =
document.getElementById("title")
.value
.trim();

const meetingDate =
document.getElementById("meetingDate")
.value;

const meetingTime =
document.getElementById("meetingTime")
.value;

const location =
document.getElementById("location")
.value
.trim();

const meetingLink =
document.getElementById("meetingLink")
.value
.trim();

const participants =
document.getElementById("participants")
.value
.trim();

const status =
document.getElementById("status")
.value;

const description =
document.getElementById("description")
.value
.trim();


if(!title){

alert("Please enter a meeting title.");

return;

}


const {
data,
error
} =
await supabaseClient
.from("meetings")
.insert({

company_id:companyId,

title:title,

meeting_date:
meetingDate || null,

meeting_time:
meetingTime || null,

location:
location || null,

meeting_link:
meetingLink || null,

participants:
participants || null,

description:
description || null,

status:status

})
.select()
.single();


if(error){

showMessage(
"Could not add meeting: " + error.message,
true
);

return;

}


meetings.push(data);

meetings.sort((a,b) => {

const dateA =
(a.meeting_date || "") +
(a.meeting_time || "");

const dateB =
(b.meeting_date || "") +
(b.meeting_time || "");

return dateA.localeCompare(dateB);

});


renderMeetings();

updateStats();

closeModal();

showMessage(
"Meeting added successfully.",
false
);

}


/* =========================
   CHANGE STATUS
========================= */

async function changeStatus(id,newStatus){

const {
error
} =
await supabaseClient
.from("meetings")
.update({
status:newStatus
})
.eq("id",id)
.eq("company_id",companyId);


if(error){

showMessage(
"Could not update meeting: " + error.message,
true
);

return;

}


const meeting =
meetings.find(m => m.id === id);

if(meeting){

meeting.status = newStatus;

}


renderMeetings();

updateStats();

showMessage(
"Meeting status updated.",
false
);

}


/* =========================
   DELETE
========================= */

async function deleteMeeting(id){

if(!confirm("Delete this meeting?")){

return;

}


const {
error
} =
await supabaseClient
.from("meetings")
.delete()
.eq("id",id)
.eq("company_id",companyId);


if(error){

showMessage(
"Could not delete meeting: " + error.message,
true
);

return;

}


meetings =
meetings.filter(
meeting => meeting.id !== id
);

renderMeetings();

updateStats();

showMessage(
"Meeting deleted successfully.",
false
);

}


/* =========================
   MODAL
========================= */

function openModal(){

document.getElementById("meetingModal")
.style.display = "flex";

}


function closeModal(){

document.getElementById("meetingModal")
.style.display = "none";

document.getElementById("title").value="";
document.getElementById("meetingDate").value="";
document.getElementById("meetingTime").value="";
document.getElementById("location").value="";
document.getElementById("meetingLink").value="";
document.getElementById("participants").value="";
document.getElementById("status").value="Scheduled";
document.getElementById("description").value="";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadUser();

</script>

</body>
  </html>
