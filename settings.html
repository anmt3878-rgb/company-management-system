<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - CompanyFlow</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 240px;
      background: #111827;
      color: white;
      padding: 24px 16px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 30px;
      padding-left: 10px;
    }

    .nav a {
      display: block;
      color: #d1d5db;
      text-decoration: none;
      padding: 11px 12px;
      border-radius: 8px;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .nav a:hover,
    .nav a.active {
      background: #2563eb;
      color: white;
    }

    .main {
      flex: 1;
      padding: 30px;
    }

    h1 {
      margin-top: 0;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    .card h2 {
      margin-top: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 600;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    input[readonly] {
      background: #f3f4f6;
    }

    button {
      margin-top: 20px;
      padding: 12px 22px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .plan {
      font-size: 22px;
      font-weight: bold;
      color: #2563eb;
    }

    @media (max-width: 700px) {
      .layout {
        display: block;
      }

      .sidebar {
        width: 100%;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .main {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<div class="layout">

  <aside class="sidebar">

    <div class="logo">CompanyFlow</div>

    <div class="nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="employees.html">Employees</a>
      <a href="customers.html">Customers</a>
      <a href="projects.html">Projects</a>
      <a href="tasks.html">Tasks</a>
      <a href="finance.html">Finance</a>
      <a href="inventory.html">Inventory</a>
      <a href="documents.html">Documents</a>
      <a href="reports.html">Reports</a>
      <a href="roles.html">Roles & Permissions</a>
      <a href="notifications.html">Notifications</a>
      <a href="settings.html" class="active">Settings</a>
      <a href="index.html">Back to Website</a>
    </div>

  </aside>


  <main class="main">

    <h1>Settings</h1>


    <div class="card">

      <h2>Company Information</h2>

      <div class="grid">

        <div class="field">
          <label>Company Name</label>
          <input id="companyName" type="text">
        </div>

        <div class="field">
          <label>Owner Name</label>
          <input id="ownerName" type="text">
        </div>

        <div class="field">
          <label>Email</label>
          <input id="email" type="email" readonly>
        </div>

        <div class="field">
          <label>Phone</label>
          <input id="phone" type="text">
        </div>

        <div class="field full">
          <label>Address</label>
          <input id="address" type="text">
        </div>

      </div>

      <button id="saveButton" onclick="saveSettings()">
        Save Changes
      </button>

      <div id="message" class="message"></div>

    </div>


    <div class="card">

      <h2>Subscription Plan</h2>

      <div id="plan" class="plan">
        Loading...
      </div>

    </div>


    <div class="card">

      <h2>Account</h2>

      <div class="grid">

        <div class="field">
          <label>User ID</label>
          <input id="userId" readonly>
        </div>

        <div class="field">
          <label>Role</label>
          <input id="role" readonly>
        </div>

      </div>

    </div>

  </main>

</div>


<script>

let user = null;
let companyId = null;


/* =========================
   SHOW MESSAGE
========================= */

function showMessage(text, type) {

  const box = document.getElementById("message");

  box.textContent = text;
  box.className = "message " + type;

}


/* =========================
   LOAD SETTINGS
========================= */

async function loadSettings() {

  try {

    const result =
      await supabaseClient.auth.getUser();

    user = result.data.user;

    if (!user) {

      window.location.href = "signin.html";
      return;

    }

    document.getElementById("email").value =
      user.email || "";

    document.getElementById("userId").value =
      user.id || "";


    /* GET PROFILE */

    const profileResult =
      await supabaseClient
        .from("profiles")
        .select("id, company_id, full_name, email, role")
        .eq("id", user.id)
        .single();


    if (profileResult.error) {

      console.error(profileResult.error);

      showMessage(
        "Profile error: " +
        profileResult.error.message,
        "error"
      );

      return;

    }


    const profile =
      profileResult.data;

    companyId =
      profile.company_id;


    document.getElementById("ownerName").value =
      profile.full_name || "";

    document.getElementById("role").value =
      profile.role || "";


    /* GET COMPANY */

    const companyResult =
      await supabaseClient
        .from("companies")
        .select(
          "id, name, owner_id, email, phone, address, plan"
        )
        .eq("id", companyId)
        .single();


    if (companyResult.error) {

      console.error(companyResult.error);

      showMessage(
        "Company error: " +
        companyResult.error.message,
        "error"
      );

      return;

    }


    const company =
      companyResult.data;


    document.getElementById("companyName").value =
      company.name || "";

    document.getElementById("phone").value =
      company.phone || "";

    document.getElementById("address").value =
      company.address || "";

    document.getElementById("plan").textContent =
      company.plan || "Free";


  } catch (error) {

    console.error(error);

    showMessage(
      "Unexpected error: " + error.message,
      "error"
    );

  }

}


/* =========================
   SAVE SETTINGS
========================= */

async function saveSettings() {

  const button =
    document.getElementById("saveButton");

  button.disabled = true;
  button.textContent = "Saving...";

  showMessage("", "");


  try {

    if (!user || !companyId) {

      throw new Error(
        "User or company information is missing."
      );

    }


    const companyName =
      document
        .getElementById("companyName")
        .value
        .trim();


    const ownerName =
      document
        .getElementById("ownerName")
        .value
        .trim();


    const phone =
      document
        .getElementById("phone")
        .value
        .trim();


    const address =
      document
        .getElementById("address")
        .value
        .trim();


    if (!companyName) {

      throw new Error(
        "Company Name cannot be empty."
      );

    }


    if (!ownerName) {

      throw new Error(
        "Owner Name cannot be empty."
      );

    }


    /* UPDATE COMPANY */

    const companyUpdate =
      await supabaseClient
        .from("companies")
        .update({
          name: companyName,
          phone: phone,
          address: address
        })
        .eq("id", companyId)
        .select()
        .single();


    if (companyUpdate.error) {

      console.error(
        "Company update error:",
        companyUpdate.error
      );

      throw new Error(
        "Company update failed: " +
        companyUpdate.error.message
      );

    }


    /* UPDATE PROFILE */

    const profileUpdate =
      await supabaseClient
        .from("profiles")
        .update({
          full_name: ownerName
        })
        .eq("id", user.id)
        .select()
        .single();


    if (profileUpdate.error) {

      console.error(
        "Profile update error:",
        profileUpdate.error
      );

      throw new Error(
        "Owner update failed: " +
        profileUpdate.error.message
      );

    }


    showMessage(
      "Settings saved successfully!",
      "success"
    );


  } catch (error) {

    console.error(error);

    showMessage(
      error.message,
      "error"
    );

  } finally {

    button.disabled = false;
    button.textContent = "Save Changes";

  }

}


/* =========================
   START
========================= */

loadSettings();

</script>

</body>
</html>
