<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projects | CompanyFlow</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #f8fafc;
    color: #0f172a;
}

header {
    background: #0f172a;
    color: white;
    padding: 18px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: #60a5fa;
    font-size: 24px;
    font-weight: 800;
}

.back {
    color: #cbd5e1;
    text-decoration: none;
    font-size: 14px;
}

.container {
    max-width: 1200px;
    margin: 35px auto;
    padding: 0 20px;
}

.page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
}

h1 {
    font-size: 30px;
    margin-bottom: 7px;
}

.subtitle {
    color: #64748b;
}

.add-button {
    background: #2563eb;
    color: white;
    border: none;
    padding: 13px 20px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.add-button:hover {
    opacity: .9;
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 25px;
}

.stat {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 22px;
}

.stat-title {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 10px;
}

.stat-value {
    font-size: 28px;
    font-weight: 800;
}

/* SEARCH */

.toolbar {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 18px;
}

.search {
    width: 100%;
    padding: 13px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
}

.search:focus {
    border-color: #2563eb;
}

/* TABLE */

.table-card {
    background: white;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    overflow: hidden;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #f8fafc;
    color: #64748b;
    font-size: 12px;
    text-align: left;
    padding: 15px;
    border-bottom: 1px solid #e2e8f0;
}

td {
    padding: 16px 15px;
    border-bottom: 1px solid #e2e8f0;
    font-size: 14px;
}

tr:last-child td {
    border-bottom: none;
}

.project-name {
    font-weight: 700;
}

.project-client {
    color: #64748b;
    font-size: 12px;
    margin-top: 4px;
}

.badge {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.active {
    background: #dbeafe;
    color: #1e40af;
}

.completed {
    background: #dcfce7;
    color: #166534;
}

.pending {
    background: #fef3c7;
    color: #92400e;
}

.cancelled {
    background: #fee2e2;
    color: #991b1b;
}

.action-button {
    background: #eff6ff;
    color: #2563eb;
    border: none;
    padding: 7px 11px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
}

.empty {
    text-align: center;
    padding: 45px 20px;
    color: #64748b;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .55);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.modal-box {
    background: white;
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 16px;
    padding: 25px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.close {
    background: #f1f5f9;
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.field {
    display: flex;
    flex-direction: column;
}

.field.full {
    grid-column: 1 / -1;
}

label {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 7px;
}

input,
select {
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
}

input:focus,
select:focus {
    border-color: #2563eb;
}

.save-button {
    width: 100%;
    margin-top: 20px;
    background: #2563eb;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

footer {
    text-align: center;
    color: #64748b;
    padding: 30px;
}

/* MOBILE */

@media (max-width: 900px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .table-card {
        overflow-x: auto;
    }

    table {
        min-width: 1000px;
    }
}

@media (max-width: 700px) {

    .page-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .add-button {
        width: 100%;
    }
}

@media (max-width: 550px) {

    .stats {
        grid-template-columns: 1fr;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .field.full {
        grid-column: auto;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        CompanyFlow
    </div>

    <a href="dashboard.html" class="back">
        ← Back to Dashboard
    </a>

</header>


<div class="container">

    <div class="page-header">

        <div>

            <h1>Projects</h1>

            <p class="subtitle">
                Plan, track, and manage your company's projects.
            </p>

        </div>

        <button
            class="add-button"
            onclick="openModal()">

            + Add Project

        </button>

    </div>


    <!-- STATS -->

    <div class="stats">

        <div class="stat">

            <div class="stat-title">
                Total Projects
            </div>

            <div
                class="stat-value"
                id="totalProjects">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Active Projects
            </div>

            <div
                class="stat-value"
                id="activeProjects">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Completed
            </div>

            <div
                class="stat-value"
                id="completedProjects">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                Pending
            </div>

            <div
                class="stat-value"
                id="pendingProjects">
                0
            </div>

        </div>

    </div>


    <!-- SEARCH -->

    <div class="toolbar">

        <input
            type="text"
            class="search"
            id="search"
            placeholder="Search projects by name, client, manager, or status..."
            oninput="renderProjects()"
        >

    </div>


    <!-- PROJECTS -->

    <div class="table-card">

        <table>

            <thead>

                <tr>

                    <th>Project</th>

                    <th>Manager</th>

                    <th>Start Date</th>

                    <th>Deadline</th>

                    <th>Budget</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="projectList"></tbody>

        </table>

    </div>

</div>


<!-- ADD PROJECT MODAL -->

<div
    class="modal"
    id="projectModal">

    <div class="modal-box">

        <div class="modal-header">

            <h2>Add Project</h2>

            <button
                class="close"
                onclick="closeModal()">
                ×
            </button>

        </div>


        <div class="form-grid">

            <div class="field full">

                <label>Project Name</label>

                <input
                    type="text"
                    id="projectName"
                    placeholder="Website Redesign"
                >

            </div>


            <div class="field">

                <label>Client</label>

                <input
                    type="text"
                    id="projectClient"
                    placeholder="Acme Inc."
                >

            </div>


            <div class="field">

                <label>Project Manager</label>

                <input
                    type="text"
                    id="projectManager"
                    placeholder="John Smith"
                >

            </div>


            <div class="field">

                <label>Start Date</label>

                <input
                    type="date"
                    id="startDate"
                >

            </div>


            <div class="field">

                <label>Deadline</label>

                <input
                    type="date"
                    id="deadline"
                >

            </div>


            <div class="field">

                <label>Budget ($)</label>

                <input
                    type="number"
                    id="budget"
                    min="0"
                    step="0.01"
                    placeholder="10000"
                >

            </div>


            <div class="field">

                <label>Status</label>

                <select id="projectStatus">

                    <option value="Active">
                        Active
                    </option>

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                    <option value="Cancelled">
                        Cancelled
                    </option>

                </select>

            </div>

        </div>


        <button
            class="save-button"
            onclick="addProject()">

            Add Project

        </button>

    </div>

</div>


<footer>
    © 2026 CompanyFlow. All rights reserved.
</footer>


<script>

function getProjects() {

    const saved =
        localStorage.getItem("projects");

    if (!saved) {
        return [];
    }

    return JSON.parse(saved);

}


function saveProjects(projects) {

    localStorage.setItem(
        "projects",
        JSON.stringify(projects)
    );

}


function renderProjects() {

    const projects =
        getProjects();

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();


    const filtered =
        projects.filter(function(project) {

            return (
                project.name.toLowerCase().includes(search) ||
                project.client.toLowerCase().includes(search) ||
                project.manager.toLowerCase().includes(search) ||
                project.status.toLowerCase().includes(search)
            );

        });


    const list =
        document.getElementById("projectList");


    if (filtered.length === 0) {

        list.innerHTML = `
            <tr>
                <td colspan="7">
                    <div class="empty">
                        No projects found.
                    </div>
                </td>
            </tr>
        `;

    } else {

        list.innerHTML =
            filtered.map(function(project) {

                let badgeClass = "active";

                if (project.status === "Completed") {
                    badgeClass = "completed";
                }

                if (project.status === "Pending") {
                    badgeClass = "pending";
                }

                if (project.status === "Cancelled") {
                    badgeClass = "cancelled";
                }


                return `

                    <tr>

                        <td>

                            <div class="project-name">
                                ${project.name}
                            </div>

                            <div class="project-client">
                                ${project.client || "No client"}
                            </div>

                        </td>


                        <td>
                            ${project.manager || "-"}
                        </td>


                        <td>
                            ${project.startDate || "-"}
                        </td>


                        <td>
                            ${project.deadline || "-"}
                        </td>


                        <td>
                            $${Number(project.budget || 0).toLocaleString()}
                        </td>


                        <td>

                            <span class="badge ${badgeClass}">

                                ${project.status}

                            </span>

                        </td>


                        <td>

                            <button
                                class="action-button"
                                onclick="deleteProject(${project.id})">

                                Delete

                            </button>

                        </td>

                    </tr>

                `;

            }).join("");

    }


    updateStats(projects);

}


function updateStats(projects) {

    const total =
        projects.length;

    const active =
        projects.filter(
            project => project.status === "Active"
        ).length;

    const completed =
        projects.filter(
            project => project.status === "Completed"
        ).length;

    const pending =
        projects.filter(
            project => project.status === "Pending"
        ).length;


    document.getElementById(
        "totalProjects"
    ).textContent = total;


    document.getElementById(
        "activeProjects"
    ).textContent = active;


    document.getElementById(
        "completedProjects"
    ).textContent = completed;


    document.getElementById(
        "pendingProjects"
    ).textContent = pending;

}


function openModal() {

    document.getElementById(
        "projectModal"
    ).style.display = "flex";

}


function closeModal() {

    document.getElementById(
        "projectModal"
    ).style.display = "none";

}


function addProject() {

    const name =
        document.getElementById(
            "projectName"
        ).value.trim();

    const client =
        document.getElementById(
            "projectClient"
        ).value.trim();

    const manager =
        document.getElementById(
            "projectManager"
        ).value.trim();

    const startDate =
        document.getElementById(
            "startDate"
        ).value;

    const deadline =
        document.getElementById(
            "deadline"
        ).value;

    const budget =
        document.getElementById(
            "budget"
        ).value;

    const status =
        document.getElementById(
            "projectStatus"
        ).value;


    if (!name) {

        alert(
            "Please enter the project name."
        );

        return;

    }


    const projects =
        getProjects();


    projects.push({

        id: Date.now(),

        name: name,

        client: client,

        manager: manager,

        startDate: startDate,

        deadline: deadline,

        budget: budget,

        status: status

    });


    saveProjects(projects);


    document.getElementById(
        "projectName"
    ).value = "";

    document.getElementById(
        "projectClient"
    ).value = "";

    document.getElementById(
        "projectManager"
    ).value = "";

    document.getElementById(
        "startDate"
    ).value = "";

    document.getElementById(
        "deadline"
    ).value = "";

    document.getElementById(
        "budget"
    ).value = "";


    closeModal();

    renderProjects();

}


function deleteProject(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this project?"
        );

    if (!confirmed) return;


    const projects =
        getProjects()
        .filter(project => project.id !== id);


    saveProjects(projects);

    renderProjects();

}


renderProjects();

</script>

</body>
</html>
