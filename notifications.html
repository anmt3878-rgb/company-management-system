<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Notifications - CompanyFlow</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #1f2937;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      background: #111827;
      color: white;
      padding: 24px 16px;
      overflow-y: auto;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 30px;
      padding-left: 10px;
    }

    .nav a {
      display: block;
      color: #d1d5db;
      text-decoration: none;
      padding: 11px 12px;
      border-radius: 8px;
      margin-bottom: 5px;
      font-size: 14px;
    }

    .nav a:hover,
    .nav a.active {
      background: #2563eb;
      color: white;
    }

    .main {
      margin-left: 240px;
      min-height: 100vh;
    }

    .topbar {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar h1 {
      font-size: 24px;
    }

    .user {
      font-size: 14px;
      color: #6b7280;
    }

    .content {
      padding: 28px;
    }

    .message {
      display: none;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 20px;
    }

    .stat-title {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: bold;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 25px;
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 13px;
      margin-bottom: 7px;
      color: #374151;
    }

    input,
    select,
    textarea {
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      outline: none;
      font-size: 14px;
      background: white;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2563eb;
    }

    .full {
      grid-column: 1 / -1;
    }

    .btn {
      border: none;
      border-radius: 7px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    .btn-success {
      background: #dcfce7;
      color: #166534;
    }

    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
    }

    .search-box {
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      max-width: 400px;
    }

    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .notification {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      background: white;
    }

    .notification.unread {
      background: #eff6ff;
      border-color: #bfdbfe;
    }

    .notification-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
    }

    .notification-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 6px;
    }

    .notification-message {
      color: #4b5563;
      font-size: 14px;
      line-height: 1.5;
    }

    .notification-meta {
      color: #6b7280;
      font-size: 12px;
      margin-top: 10px;
    }

    .notification-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .type-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 15px;
      background: #e5e7eb;
      color: #374151;
      font-size: 11px;
      margin-left: 5px;
    }

    .empty {
      text-align: center;
      color: #6b7280;
      padding: 30px;
    }

    @media (max-width: 900px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 700px) {
      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
      }

      .main {
        margin-left: 0;
      }

      .topbar {
        padding: 16px;
      }

      .content {
        padding: 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .notification-header {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="logo">
      CompanyFlow
    </div>

    <nav class="nav">

      <a href="dashboard.html">Dashboard</a>

      <a href="employees.html">Employees</a>

      <a href="customers.html">Customers</a>

      <a href="projects.html">Projects</a>

      <a href="tasks.html">Tasks</a>

      <a href="finance.html">Finance</a>

      <a href="inventory.html">Inventory</a>

      <a href="documents.html">Documents</a>

      <a href="reports.html">Reports</a>

      <a href="roles.html">Roles & Permissions</a>

      <a href="notifications.html" class="active">
        Notifications
      </a>

      <a href="settings.html">Settings</a>

      <a href="index.html">Back to Website</a>

    </nav>

  </aside>

  <main class="main">

    <header class="topbar">

      <h1>Notifications</h1>

      <div class="user" id="userInfo">
        Loading...
      </div>

    </header>

    <section class="content">

      <div id="message" class="message"></div>

      <!-- Statistics -->

      <div class="stats">

        <div class="stat">

          <div class="stat-title">
            Total Notifications
          </div>

          <div
            class="stat-value"
            id="totalNotifications"
          >
            0
          </div>

        </div>

        <div class="stat">

          <div class="stat-title">
            Unread
          </div>

          <div
            class="stat-value"
            id="unreadNotifications"
          >
            0
          </div>

        </div>

        <div class="stat">

          <div class="stat-title">
            Read
          </div>

          <div
            class="stat-value"
            id="readNotifications"
          >
            0
          </div>

        </div>

      </div>

      <!-- Add Notification -->

      <div class="card">

        <h2>
          Create Notification
        </h2>

        <form id="notificationForm">

          <div class="form-grid">

            <div class="form-group">

              <label>
                Title
              </label>

              <input
                type="text"
                id="title"
                placeholder="Notification title"
                required
              >

            </div>

            <div class="form-group">

              <label>
                Type
              </label>

              <select id="type">

                <option value="General">
                  General
                </option>

                <option value="Task">
                  Task
                </option>

                <option value="Finance">
                  Finance
                </option>

                <option value="Employee">
                  Employee
                </option>

                <option value="Project">
                  Project
                </option>

                <option value="System">
                  System
                </option>

              </select>

            </div>

            <div class="form-group full">

              <label>
                Message
              </label>

              <textarea
                id="notificationMessage"
                placeholder="Write notification message..."
                required
              ></textarea>

            </div>

            <div class="form-group full">

              <button
                type="submit"
                class="btn btn-primary"
                id="addButton"
              >
                Create Notification
              </button>

            </div>

          </div>

        </form>

      </div>

      <!-- Notifications -->

      <div class="card">

        <h2>
          Your Notifications
        </h2>

        <div class="search-box">

          <input
            type="text"
            id="searchInput"
            placeholder="Search notifications..."
          >

        </div>

        <div class="filters">

          <button
            class="btn btn-secondary"
            onclick="setFilter('all')"
          >
            All
          </button>

          <button
            class="btn btn-secondary"
            onclick="setFilter('unread')"
          >
            Unread
          </button>

          <button
            class="btn btn-secondary"
            onclick="setFilter('read')"
          >
            Read
          </button>

          <button
            class="btn btn-success"
            onclick="markAllAsRead()"
          >
            Mark All as Read
          </button>

        </div>

        <div id="notificationsList">

          <div class="empty">
            Loading notifications...
          </div>

        </div>

      </div>

    </section>

  </main>

  <script>

    let userId = null;

    let companyId = null;

    let notifications = [];

    let currentFilter = "all";


    const messageBox =
      document.getElementById("message");


    function showMessage(
      text,
      type = "success"
    ) {

      messageBox.textContent = text;

      messageBox.className =
        "message " + type;

      messageBox.style.display =
        "block";

      setTimeout(() => {

        messageBox.style.display =
          "none";

      }, 4000);
    }


    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
    }


    function formatDate(date) {

      if (!date) return "-";

      const d =
        new Date(date);

      if (isNaN(d.getTime())) {
        return date;
      }

      return d.toLocaleString(
        "en-US",
        {
          dateStyle: "medium",
          timeStyle: "short"
        }
      );
    }


    async function loadUser() {

      const {
        data: { user },
        error
      } =
        await supabaseClient
          .auth
          .getUser();


      if (error || !user) {

        window.location.href =
          "signin.html";

        return null;
      }


      userId =
        user.id;


      document.getElementById(
        "userInfo"
      ).textContent =
        user.email || "User";


      return user;
    }


    async function loadCompany() {

      const user =
        await loadUser();


      if (!user) {
        return false;
      }


      const {
        data,
        error
      } =
        await supabaseClient

          .from("profiles")

          .select(
            "company_id, full_name"
          )

          .eq("id", user.id)

          .single();


      if (error) {

        console.error(error);

        showMessage(
          "Could not load company information.",
          "error"
        );

        return false;
      }


      companyId =
        data.company_id;


      if (data.full_name) {

        document.getElementById(
          "userInfo"
        ).textContent =
          data.full_name;
      }


      return true;
    }


    async function loadNotifications() {

      if (!companyId || !userId) {
        return;
      }


      const {
        data,
        error
      } =
        await supabaseClient

          .from("notifications")

          .select("*")

          .eq(
            "company_id",
            companyId
          )

          .eq(
            "user_id",
            userId
          )

          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(error);

        showMessage(
          "Could not load notifications: " +
          error.message,
          "error"
        );

        return;
      }


      notifications =
        data || [];


      updateStats();

      renderNotifications();
    }


    function updateStats() {

      const total =
        notifications.length;


      const unread =
        notifications.filter(
          notification =>
            notification.is_read === false
        ).length;


      const read =
        notifications.filter(
          notification =>
            notification.is_read === true
        ).length;


      document.getElementById(
        "totalNotifications"
      ).textContent =
        total;


      document.getElementById(
        "unreadNotifications"
      ).textContent =
        unread;


      document.getElementById(
        "readNotifications"
      ).textContent =
        read;
    }


    function setFilter(filter) {

      currentFilter =
        filter;

      renderNotifications();
    }


    function renderNotifications() {

      const container =
        document.getElementById(
          "notificationsList"
        );


      const search =
        document.getElementById(
          "searchInput"
        )
        .value
        .toLowerCase()
        .trim();


      let filtered =
        notifications.filter(
          notification => {

            if (
              currentFilter ===
              "unread" &&
              notification.is_read
            ) {
              return false;
            }


            if (
              currentFilter ===
              "read" &&
              !notification.is_read
            ) {
              return false;
            }


            const title =
              String(
                notification.title || ""
              ).toLowerCase();


            const message =
              String(
                notification.message || ""
              ).toLowerCase();


            const type =
              String(
                notification.type || ""
              ).toLowerCase();


            return (
              title.includes(search) ||
              message.includes(search) ||
              type.includes(search)
            );

          }
        );


      if (filtered.length === 0) {

        container.innerHTML = `
          <div class="empty">
            No notifications found.
          </div>
        `;

        return;
      }


      container.innerHTML =
        filtered.map(
          notification => {

            const unread =
              !notification.is_read;


            return `

              <div
                class="notification ${
                  unread ? "unread" : ""
                }"
              >

                <div class="notification-header">

                  <div>

                    <div class="notification-title">

                      ${escapeHTML(
                        notification.title
                      )}

                      <span class="type-badge">

                        ${escapeHTML(
                          notification.type ||
                          "General"
                        )}

                      </span>

                    </div>

                    <div class="notification-message">

                      ${escapeHTML(
                        notification.message
                      )}

                    </div>

                    <div class="notification-meta">

                      ${formatDate(
                        notification.created_at
                      )}

                      ${
                        unread
                          ? " • Unread"
                          : " • Read"
                      }

                    </div>

                  </div>

                </div>

                <div class="notification-actions">

                  ${
                    unread
                      ? `
                        <button
                          class="btn btn-success"
                          onclick="markAsRead('${notification.id}')"
                        >
                          Mark as Read
                        </button>
                      `
                      : ""
                  }

                  <button
                    class="btn btn-danger"
                    onclick="deleteNotification('${notification.id}')"
                  >
                    Delete
                  </button>

                </div>

              </div>

            `;

          }
        ).join("");
    }


    async function addNotification(event) {

      event.preventDefault();


      if (!companyId || !userId) {

        showMessage(
          "User information is not available.",
          "error"
        );

        return;
      }


      const title =
        document.getElementById(
          "title"
        )
        .value
        .trim();


      const message =
        document.getElementById(
          "notificationMessage"
        )
        .value
        .trim();


      const type =
        document.getElementById(
          "type"
        ).value;


      if (!title || !message) {

        showMessage(
          "Title and message are required.",
          "error"
        );

        return;
      }


      const button =
        document.getElementById(
          "addButton"
        );


      button.disabled = true;

      button.textContent =
        "Creating...";


      const {
        error
      } =
        await supabaseClient

          .from("notifications")

          .insert({

            company_id:
              companyId,

            user_id:
              userId,

            title:
              title,

            message:
              message,

            type:
              type,

            is_read:
              false

          });


      button.disabled = false;

      button.textContent =
        "Create Notification";


      if (error) {

        console.error(error);

        showMessage(
          "Could not create notification: " +
          error.message,
          "error"
        );

        return;
      }


      document.getElementById(
        "notificationForm"
      ).reset();


      showMessage(
        "Notification created successfully."
      );


      await loadNotifications();
    }


    async function markAsRead(id) {

      const {
        error
      } =
        await supabaseClient

          .from("notifications")

          .update({
            is_read: true
          })

          .eq(
            "id",
            id
          )

          .eq(
            "company_id",
            companyId
          )

          .eq(
            "user_id",
            userId
          );


      if (error) {

        console.error(error);

        showMessage(
          "Could not mark notification as read: " +
          error.message,
          "error"
        );

        return;
      }


      showMessage(
        "Notification marked as read."
      );


      await loadNotifications();
    }


    async function markAllAsRead() {

      const unreadCount =
        notifications.filter(
          notification =>
            notification.is_read === false
        ).length;


      if (unreadCount === 0) {

        showMessage(
          "There are no unread notifications."
        );

        return;
      }


      const {
        error
      } =
        await supabaseClient

          .from("notifications")

          .update({
            is_read: true
          })

          .eq(
            "company_id",
            companyId
          )

          .eq(
            "user_id",
            userId
          )

          .eq(
            "is_read",
            false
          );


      if (error) {

        console.error(error);

        showMessage(
          "Could not mark notifications as read: " +
          error.message,
          "error"
        );

        return;
      }


      showMessage(
        "All notifications marked as read."
      );


      await loadNotifications();
    }


    async function deleteNotification(id) {

      const confirmed =
        confirm(
          "Are you sure you want to delete this notification?"
        );


      if (!confirmed) {
        return;
      }


      const {
        error
      } =
        await supabaseClient

          .from("notifications")

          .delete()

          .eq(
            "id",
            id
          )

          .eq(
            "company_id",
            companyId
          )

          .eq(
            "user_id",
            userId
          );


      if (error) {

        console.error(error);

        showMessage(
          "Could not delete notification: " +
          error.message,
          "error"
        );

        return;
      }


      showMessage(
        "Notification deleted successfully."
      );


      await loadNotifications();
    }


    document.getElementById(
      "notificationForm"
    ).addEventListener(
      "submit",
      addNotification
    );


    document.getElementById(
      "searchInput"
    ).addEventListener(
      "input",
      renderNotifications
    );


    async function init() {

      const ready =
        await loadCompany();


      if (!ready) {
        return;
      }


      await loadNotifications();
    }


    init();

  </script>

</body>
</html>
