<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In | CompanyFlow</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    background: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 440px;
}

.logo {
    text-align: center;
    color: #2563eb;
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 20px;
}

.card {
    background: white;
    padding: 36px;
    border-radius: 18px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 15px 40px rgba(0,0,0,0.08);
}

h1 {
    text-align: center;
    color: #0f172a;
    font-size: 28px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #64748b;
    line-height: 1.6;
    margin-bottom: 28px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    color: #334155;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #cbd5e1;
    border-radius: 9px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
}

.password-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.forgot {
    color: #2563eb;
    text-decoration: none;
    font-size: 13px;
}

.button {
    width: 100%;
    border: none;
    background: #2563eb;
    color: white;
    padding: 14px;
    border-radius: 9px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 5px;
}

.button:hover {
    background: #1d4ed8;
}

.register {
    text-align: center;
    margin-top: 22px;
    color: #64748b;
    font-size: 14px;
}

.register a {
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #64748b;
    text-decoration: none;
    font-size: 14px;
}

@media (max-width: 500px) {
    .card {
        padding: 27px 20px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        CompanyFlow
    </div>

    <div class="card">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Sign in to manage your business.
        </p>

        <form id="signinForm">

            <div class="form-group">

                <label for="email">
                    Business Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@company.com"
                    required
                >

            </div>

            <div class="form-group">

                <div class="password-row">

                    <label for="password">
                        Password
                    </label>

                    <a href="#" class="forgot"
                       onclick="forgotPassword(event)">
                        Forgot password?
                    </a>

                </div>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>

            <button
                type="submit"
                class="button">
                Sign In
            </button>

        </form>

        <div class="register">

            Don't have an account?

            <a href="register.html">
                Create an account
            </a>

        </div>

    </div>

    <a href="index.html" class="back">
        ← Back to CompanyFlow
    </a>

</div>

<script>

document.getElementById("signinForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    const savedEmail = localStorage.getItem("userEmail");

    if (savedEmail && email === savedEmail) {

        alert("Sign in successful!");

        window.location.href = "dashboard.html";

    } else {

        alert(
            "Demo sign-in: account authentication will be connected to the secure database later."
        );

        window.location.href = "dashboard.html";
    }

});


function forgotPassword(event) {

    event.preventDefault();

    alert(
        "Password recovery will be available after secure authentication is connected."
    );

}

</script>

</body>
</html>
