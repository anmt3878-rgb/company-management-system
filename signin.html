<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ورود به حساب | CompanyFlow</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 27px;
      font-weight: bold;
      color: #2563eb;
      margin-bottom: 12px;
    }

    h1 {
      text-align: center;
      color: #172033;
      margin-bottom: 8px;
    }

    .description {
      text-align: center;
      color: #64748b;
      margin-bottom: 28px;
      line-height: 1.7;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #172033;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border: 1px solid #dbe3f0;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .forgot {
      display: block;
      text-align: left;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 22px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .register {
      text-align: center;
      margin-top: 22px;
      color: #64748b;
    }

    .register a {
      color: #2563eb;
      font-weight: bold;
      text-decoration: none;
    }

    .home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      CompanyFlow
    </div>

    <h1>خوش آمدید 👋</h1>

    <p class="description">
      برای ورود به حساب شرکت خود، اطلاعاتتان را وارد کنید.
    </p>

    <form id="signinForm">

      <label for="email">ایمیل</label>

      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        required
      >

      <label for="password">رمز عبور</label>

      <input
        type="password"
        id="password"
        placeholder="رمز عبور خود را وارد کنید"
        required
      >

      <a href="#" class="forgot">
        رمز عبور را فراموش کرده‌اید؟
      </a>

      <button type="submit">
        ورود به حساب
      </button>

    </form>

    <div class="register">
      حساب ندارید؟
      <a href="register.html">حساب شرکت بسازید</a>
    </div>

    <a href="index.html" class="home">
      ← بازگشت به صفحه اصلی
    </a>

  </div>

  <script>
    document
      .getElementById("signinForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        if (!email || !password) {
          alert("لطفاً ایمیل و رمز عبور را وارد کنید.");
          return;
        }

        alert("ورود آزمایشی انجام شد.");

      });
  </script>

</body>
</html>
