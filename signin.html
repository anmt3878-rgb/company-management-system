<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In | CompanyFlow</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f7fb;
      color: #172033;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo a {
      text-decoration: none;
      font-size: 28px;
      font-weight: 800;
      color: #172033;
    }

    .logo span {
      color: #2563eb;
    }

    .card {
      background: white;

      border: 1px solid #e5e7eb;

      border-radius: 16px;

      padding: 32px;

      box-shadow:
        0 10px 35px rgba(15, 23, 42, 0.06);
    }

    .card h1 {
      text-align: center;

      font-size: 27px;

      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;

      color: #64748b;

      font-size: 14px;

      line-height: 1.6;

      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;

      color: #334155;

      font-size: 13px;

      font-weight: 700;

      margin-bottom: 7px;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid #d1d5db;

      border-radius: 9px;

      font-size: 14px;

      outline: none;

      transition: 0.2s;
    }

    input:focus {
      border-color: #2563eb;

      box-shadow:
        0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 75px;
    }

    .show-password {
      position: absolute;

      right: 10px;

      top: 50%;

      transform: translateY(-50%);

      background: none;

      border: none;

      color: #2563eb;

      font-size: 12px;

      font-weight: bold;

      cursor: pointer;
    }

    .options {
      display: flex;

      align-items: center;

      justify-content: space-between;

      margin: 5px 0 20px;
    }

    .remember {
      display: flex;

      align-items: center;

      gap: 7px;

      color: #64748b;

      font-size: 12px;
    }

    .remember input {
      width: 15px;

      height: 15px;
    }

    .forgot {
      color: #2563eb;

      font-size: 12px;

      text-decoration: none;

      font-weight: 600;

      cursor: pointer;
    }

    .signin-btn {
      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 9px;

      background: #2563eb;

      color: white;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.2s;
    }

    .signin-btn:hover {
      background: #1d4ed8;
    }

    .signin-btn:disabled {
      opacity: 0.7;

      cursor: not-allowed;
    }

    .message {
      display: none;

      margin-top: 16px;

      padding: 12px;

      border-radius: 8px;

      text-align: center;

      font-size: 13px;

      line-height: 1.5;
    }

    .success {
      background: #dcfce7;

      color: #166534;
    }

    .error {
      background: #fee2e2;

      color: #b91c1c;
    }

    .register {
      text-align: center;

      margin-top: 22px;

      color: #64748b;

      font-size: 13px;
    }

    .register a {
      color: #2563eb;

      font-weight: 700;

      text-decoration: none;
    }

    .back-home {
      display: block;

      text-align: center;

      margin-top: 20px;

      color: #64748b;

      font-size: 13px;

      text-decoration: none;
    }

    .back-home:hover {
      color: #2563eb;
    }

    .security-note {
      margin-top: 20px;

      padding: 12px;

      background: #f8fafc;

      border-radius: 8px;

      color: #64748b;

      font-size: 11px;

      line-height: 1.5;

      text-align: center;
    }

    @media (max-width: 500px) {

      body {
        padding: 15px;
      }

      .card {
        padding: 24px 20px;
      }

      .card h1 {
        font-size: 24px;
      }

      .options {
        align-items: flex-start;

        gap: 10px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <div class="logo">

      <a href="index.html">
        Company<span>Flow</span>
      </a>

    </div>


    <div class="card">

      <h1>
        Welcome Back
      </h1>

      <p class="subtitle">
        Sign in to manage your business with CompanyFlow.
      </p>


      <form id="signinForm">

        <div class="form-group">

          <label for="email">
            Business Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@company.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-password"
              onclick="togglePassword()"
            >
              Show
            </button>

          </div>

        </div>


        <div class="options">

          <label class="remember">

            <input
              type="checkbox"
              id="remember"
            >

            Remember me

          </label>


          <a
            href="#"
            class="forgot"
            onclick="forgotPassword(event)"
          >
            Forgot password?
          </a>

        </div>


        <button
          type="submit"
          class="signin-btn"
          id="signinBtn"
        >
          Sign In
        </button>


        <div
          id="message"
          class="message"
        ></div>

      </form>


      <div class="register">

        Don't have an account?

        <a href="register.html">
          Create Account
        </a>

      </div>


      <a
        href="index.html"
        class="back-home"
      >
        ← Back to Homepage
      </a>


      <div class="security-note">

        Your password is securely handled by
        CompanyFlow authentication.

        It is not stored in browser local storage.

      </div>

    </div>

  </div>


  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>


  <script>

    function togglePassword() {

      const password =
        document.getElementById("password");

      const button =
        document.querySelector(".show-password");


      if (password.type === "password") {

        password.type = "text";

        button.textContent = "Hide";

      } else {

        password.type = "password";

        button.textContent = "Show";

      }

    }


    function showMessage(text, type) {

      const message =
        document.getElementById("message");


      message.className =
        "message " + type;


      message.textContent =
        text;


      message.style.display =
        "block";

    }


    async function forgotPassword(event) {

      event.preventDefault();


      const email =
        document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();


      if (!email) {

        showMessage(
          "Please enter your email first.",
          "error"
        );

        return;

      }


      try {

        const { error } =
          await supabaseClient.auth.resetPasswordForEmail(
            email,
            {
              redirectTo:
                window.location.origin +
                "/reset-password.html"
            }
          );


        if (error) {

          throw error;

        }


        showMessage(
          "Password reset instructions have been sent to your email.",
          "success"
        );


      } catch (error) {

        console.error(
          "Password reset error:",
          error
        );


        showMessage(
          "Unable to send password reset email. Please check your email address.",
          "error"
        );

      }

    }


    document
      .getElementById("signinForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const email =
            document
              .getElementById("email")
              .value
              .trim()
              .toLowerCase();


          const password =
            document
              .getElementById("password")
              .value;


          const remember =
            document.getElementById("remember");


          const signinBtn =
            document.getElementById("signinBtn");


          if (!email || !password) {

            showMessage(
              "Please enter your email and password.",
              "error"
            );

            return;

          }


          signinBtn.disabled = true;

          signinBtn.textContent =
            "Signing In...";


          try {

            const { data, error } =
              await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

              });


            if (error) {

              throw error;

            }


            if (!data || !data.user) {

              throw new Error(
                "Unable to sign in."
              );

            }


            localStorage.setItem(
              "signedIn",
              "true"
            );


            localStorage.setItem(
              "userEmail",
              email
            );


            if (remember && remember.checked) {

              localStorage.setItem(
                "rememberLogin",
                "true"
              );

            } else {

              localStorage.removeItem(
                "rememberLogin"
              );

            }


            showMessage(
              "Sign in successful. Opening your dashboard...",
              "success"
            );


            setTimeout(function() {

              window.location.href =
                "dashboard.html";

            }, 800);


          } catch (error) {

            console.error(
              "Sign in error:",
              error
            );


            let errorMessage =
              "Invalid email or password.";


            if (
              error.message &&
              error.message
                .toLowerCase()
                .includes("email not confirmed")
            ) {

              errorMessage =
                "Please confirm your email before signing in.";

            }


            showMessage(
              errorMessage,
              "error"
            );


            signinBtn.disabled = false;

            signinBtn.textContent =
              "Sign In";

          }

        }
      );

  </script>

</body>
</html>
