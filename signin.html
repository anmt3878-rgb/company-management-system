<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In | CompanyFlow</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f7fb;
      color: #172033;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo a {
      color: #172033;
      text-decoration: none;
      font-size: 29px;
      font-weight: 800;
    }

    .logo span {
      color: #2563eb;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 35px rgba(15, 23, 42, 0.06);
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #334155;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 70px;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #2563eb;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 5px 0 22px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #64748b;
      font-size: 12px;
    }

    .remember input {
      width: 15px;
      height: 15px;
    }

    .forgot {
      color: #2563eb;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    .signin-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .signin-btn:hover {
      background: #1d4ed8;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #b91c1c;
    }

    .register {
      text-align: center;
      margin-top: 22px;
      color: #64748b;
      font-size: 13px;
    }

    .register a {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      font-size: 13px;
      text-decoration: none;
    }

    .back-home:hover {
      color: #2563eb;
    }

    .security-note {
      margin-top: 20px;
      padding: 12px;
      background: #f8fafc;
      border-radius: 8px;
      color: #64748b;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 500px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 25px 20px;
      }

      h1 {
        font-size: 24px;
      }

      .form-options {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <a href="index.html">
        Company<span>Flow</span>
      </a>
    </div>


    <div class="card">

      <h1>
        Welcome Back
      </h1>

      <p class="subtitle">
        Sign in to manage your company with CompanyFlow.
      </p>


      <form id="signinForm">

        <div class="form-group">

          <label for="email">
            Business Email
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@company.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-password"
              onclick="togglePassword()"
            >
              Show
            </button>

          </div>

        </div>


        <div class="form-options">

          <label class="remember">

            <input
              type="checkbox"
              id="remember"
            >

            <span>
              Remember me
            </span>

          </label>


          <a
            href="#"
            class="forgot"
            onclick="forgotPassword(event)"
          >
            Forgot password?
          </a>

        </div>


        <button
          type="submit"
          class="signin-btn"
        >
          Sign In
        </button>


        <div
          id="message"
          class="message"
        ></div>

      </form>


      <div class="register">

        Don't have an account?

        <a href="register.html">
          Create an account
        </a>

      </div>


      <a
        href="index.html"
        class="back-home"
      >
        ← Back to Homepage
      </a>


      <div class="security-note">

        This is currently the development version.
        Secure multi-user authentication will be
        connected to the production backend later.

      </div>

    </div>

  </div>


  <script>

    function togglePassword() {

      const password =
        document.getElementById("password");

      const button =
        document.querySelector(".show-password");

      if (password.type === "password") {

        password.type = "text";
        button.textContent = "Hide";

      } else {

        password.type = "password";
        button.textContent = "Show";

      }
    }


    function forgotPassword(event) {

      event.preventDefault();

      alert(
        "Password recovery will be available when secure account authentication is connected."
      );

    }


    document
      .getElementById("signinForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


        const password =
          document.getElementById("password").value;


        const message =
          document.getElementById("message");


        const savedEmail =
          (
            localStorage.getItem("userEmail") || ""
          ).toLowerCase();


        if (!email || !password) {

          message.className =
            "message error";

          message.textContent =
            "Please enter your email and password.";

          message.style.display =
            "block";

          return;

        }


        /*
          Development authentication:
          Check the email saved during registration.
        */

        if (
          savedEmail &&
          email === savedEmail
        ) {

          localStorage.setItem(
            "signedIn",
            "true"
          );

          if (
            document.getElementById("remember").checked
          ) {

            localStorage.setItem(
              "rememberLogin",
              "true"
            );

          }


          message.className =
            "message success";

          message.textContent =
            "Sign in successful. Opening your dashboard...";

          message.style.display =
            "block";


          setTimeout(function() {

            window.location.href =
              "dashboard.html";

          }, 800);


          return;

        }


        /*
          Development fallback:
          Allows the dashboard to be opened while
          the real authentication backend is being built.
        */

        localStorage.setItem(
          "signedIn",
          "true"
        );


        message.className =
          "message success";

        message.textContent =
          "Sign in successful. Opening your dashboard...";

        message.style.display =
          "block";


        setTimeout(function() {

          window.location.href =
            "dashboard.html";

        }, 800);

      });

  </script>

</body>
</html>
